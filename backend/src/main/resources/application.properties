# ===========================================
# APPLICATION
# ===========================================
spring.application.name=gamified-environmental-education

server.port=8080

# ===========================================
# MYSQL DATABASE CONFIGURATION
# ===========================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/gamified_environmental_education?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000


# ===========================================
# JPA / HIBERNATE
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===========================================
# JWT CONFIGURATION
# ===========================================
jwt.secret=GamifiedEnvironmentalEducationSecureJwtSecretKey2026SuperSecureString512BitsLong!
jwt.expiration=86400000

# ===========================================
# FILE UPLOAD
# ===========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===========================================
# MOCK OTP CONFIGURATION
# ===========================================
app.otp.length=6
app.otp.expiry-minutes=5
app.otp.resend-delay-seconds=60

# ===========================================
# LOGGING
# ===========================================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

